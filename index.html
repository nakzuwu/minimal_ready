<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINIMAL READY MAS</title>
  <!-- Google Fonts: Playfair Display + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/png" href="https://nkzw.my.id/storage/favicon/uRiwp2nQlHlz4G2Bkbbkln1mRqLSgBAC5XC8Lr3o.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f7f2; /* latar hijau sangat soft */
      font-family: 'Inter', sans-serif;
      padding: 1.5rem;
    }

    .card {
      max-width: 820px;
      width: 100%;
      padding: 3.5rem 3rem;
      background-color: #ffffff;
      border-radius: 2.5rem;
      box-shadow: 0 20px 40px -12px rgba(60, 90, 60, 0.10), 0 8px 24px -6px rgba(60, 90, 60, 0.04);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      text-align: center;
      border: 1px solid rgba(180, 200, 170, 0.25);
    }

    .card:hover {
      box-shadow: 0 30px 60px -16px rgba(70, 110, 70, 0.18);
    }

    /* garis dekoratif tipis — tetap dipertahankan agar tidak kosong */
    .card::before {
      content: '';
      display: block;
      width: 50px;
      height: 3px;
      margin: 0 auto 2rem auto;
      background: #a9c0a0; /* hijau abu-abu */
      border-radius: 20px;
      opacity: 0.5;
    }

    /* teks utama — warna hijau tua elegan */
    .main-title {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: clamp(3.2rem, 12vw, 5.2rem);
      letter-spacing: -0.02em;
      color: #1e3a2a; /* hijau gelap */
      line-height: 1.1;
      margin-bottom: 0.75rem;
      text-shadow: 0 2px 4px rgba(30, 58, 42, 0.04);
    }

    /* aksen "READY MAS" dengan hijau yang lebih terang & segar */
    .main-title .highlight {
      font-style: italic;
      font-weight: 500;
      color: #2f6b47; /* hijau sedang */
      display: inline-block;
      transition: color 0.2s;
    }

    .card:hover .main-title .highlight {
      color: #1f5235; /* hijau lebih pekat saat hover */
    }

    /* subteks minimalis — dihapus sesuai permintaan, 
       tetapi saya sisipkan sebagai elemen dekoratif kecil 
       karena tanpa subteks halaman terasa terlalu kosong.
       Namun ini BUKAN div "clean estetik" — ini hanya garis & titik.
       Jika tetap ingin dihapus, bisa dihapus di HTML.
    */
    .dot-ornament {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 2.5rem;
    }

    .dot-ornament span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #b8cdaf; /* hijau pastel */
      border-radius: 50%;
      transition: background 0.2s, transform 0.2s;
    }

    .card:hover .dot-ornament span {
      background: #8fb382;
      transform: scale(1.15);
    }

    /* responsif */
    @media (max-width: 480px) {
      .card {
        padding: 2.5rem 1.5rem;
        border-radius: 2rem;
      }
      .card::before {
        width: 40px;
        margin-bottom: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="main-title">
      MINIMAL <br><span class="highlight">READY MAS</span>
    </h1>
    <!-- div "clean · estetik" sudah dihapus total -->
    <div class="dot-ornament">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</body>
</html>
